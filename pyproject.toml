[project]
name = "local-digital-human-mvp"
version = "0.1.0"
description = "Local short-form Chinese digital-human pipeline for Apple Silicon"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "openai>=2.0,<3",
    "pillow>=11,<13",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.20,<1",
    "regex>=2024.11.6",
    "soundfile>=0.13,<1",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
tts = ["mlx-audio==0.5.4"]
test = [
    "numpy>=2.0,<3",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "scipy>=1.13,<2",
]

[project.scripts]
digital-human-api = "digital_human.api:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digital_human"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "integration: requires local system binaries such as ffmpeg",
    "real_models: downloads/loads ML model weights",
]
