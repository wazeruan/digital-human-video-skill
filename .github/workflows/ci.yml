name: skill checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-skill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check source hygiene and helper scripts
        run: |
          python3 scripts/release_audit.py
          bash -n scripts/*.sh

      - name: Package and inspect the Codex skill
        run: |
          scripts/package_skill.sh "$RUNNER_TEMP/digital-human-video.zip"
          unzip -t "$RUNNER_TEMP/digital-human-video.zip"
          unzip -l "$RUNNER_TEMP/digital-human-video.zip"

  ffmpeg-smoke:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install FFmpeg
        run: brew install ffmpeg

      - name: Test local audio-video composition
        run: ./scripts/smoke_ffmpeg.sh
