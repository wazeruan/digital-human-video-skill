name: commercial release preflight

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-candidate:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Enforce release and commercial gates
        run: python3 scripts/release_audit.py --release --commercial

      - name: Test FFmpeg composition and shell scripts
        run: |
          brew install ffmpeg
          bash -n scripts/*.sh
          ./scripts/smoke_ffmpeg.sh

      - name: Package and inspect the buyer skill
        run: |
          scripts/package_skill.sh "$RUNNER_TEMP/digital-human-video.zip"
          unzip -t "$RUNNER_TEMP/digital-human-video.zip"
          unzip -l "$RUNNER_TEMP/digital-human-video.zip"
